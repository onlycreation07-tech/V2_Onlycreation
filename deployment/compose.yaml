services:
  app:
    build: ..
    restart: unless-stopped
    init: true
    env_file: ../.env
    environment:
      NODE_ENV: production
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - /etc/onlycreation/firebase-service-account.json:/run/secrets/firebase.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=512m
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
